# SOPs for children, older adults and pets. These carry lower thresholds than the
# general-population SOPs on purpose.
sops:
  - id: SOP-VG-01
    category: vulnerable_groups
    severity: high
    title: Heat risk for a child outdoors
    kind: numeric
    applies_to:
      audience_any: [child]
    conditions:
      apparent_temperature: {gte: 34}
    advice: >-
      Keep a child out of this heat. Children heat up faster than adults, sweat
      less efficiently and often do not ask for water. At a feels-like
      temperature of 34 C or above, move the outing to before 10:00 or after
      17:00. If you do go out, stay in shade, offer water every 15-20 minutes,
      dress them in loose light clothing, and go straight indoors if they turn
      flushed, limp or stop sweating. Never leave a child in a parked vehicle.
    cite_as: SOP-VG-01 (Heat risk for a child outdoors)

  - id: SOP-VG-02
    category: vulnerable_groups
    severity: moderate
    title: Cold exposure risk for a child
    kind: numeric
    applies_to:
      audience_any: [child]
    conditions:
      apparent_temperature_min: {lte: 8}
    advice: >-
      Dress a child for cold before going out. At a feels-like temperature of 8 C
      or below, small bodies lose heat quickly through the head, hands and feet.
      Use layers rather than one thick coat, cover the head and hands, keep the
      time outdoors short, and go in if their hands turn cold to the touch or they
      start shivering.
    cite_as: SOP-VG-02 (Cold exposure risk for a child)

  - id: SOP-VG-03
    category: vulnerable_groups
    severity: high
    title: Heat risk for an older adult
    kind: numeric
    applies_to:
      audience_any: [elderly]
    conditions:
      apparent_temperature: {gte: 32}
    advice: >-
      Avoid taking an older adult out in this heat. Ageing blunts both the thirst
      signal and the sweat response, and several common medications for blood
      pressure and the heart make it worse, so heat illness can arrive without the
      usual warning. At a feels-like temperature of 32 C or above, keep to a cool
      indoor space, take fluids regularly rather than on thirst, and seek medical
      help for confusion, fainting or hot dry skin.
    cite_as: SOP-VG-03 (Heat risk for an older adult)

  - id: SOP-VG-04
    category: vulnerable_groups
    severity: moderate
    title: Cold exposure risk for an older adult
    kind: numeric
    applies_to:
      audience_any: [elderly]
    conditions:
      apparent_temperature_min: {lte: 10}
    advice: >-
      Take cold seriously for an older adult. At a feels-like temperature of 10 C
      or below, cold raises blood pressure and strains the heart, and body
      temperature can drop without obvious shivering. Keep the trip short, use
      layers plus a hat and gloves, avoid going out in the coldest part of the
      early morning, and keep an eye out for confusion or slurred speech.
    cite_as: SOP-VG-04 (Cold exposure risk for an older adult)

  - id: SOP-VG-05
    category: vulnerable_groups
    severity: high
    title: Hot pavement risk for a dog
    kind: numeric
    applies_to:
      audience_any: [pet]
      activity_tags_any: [pet_walk]
    conditions:
      any_of:
        - temperature_2m: {gte: 32}
        - all_of:
            - temperature_2m: {gte: 28}
            - uv_index: {gte: 7}
    advice: >-
      Do not walk a dog on paved ground now. Asphalt in direct sun runs far hotter
      than the air and can burn paw pads within a minute at these air
      temperatures. Press the back of your hand to the surface for seven seconds -
      if you cannot hold it there, it is too hot for paws. Walk at dawn or after
      dark instead, keep to grass and shade, and carry water. Dogs cannot sweat;
      heavy panting, drooling and stumbling mean stop immediately.
    cite_as: SOP-VG-05 (Hot pavement risk for a dog)

  - id: SOP-VG-06
    category: vulnerable_groups
    severity: moderate
    title: Sun protection for a child
    kind: numeric
    applies_to:
      audience_any: [child]
    time_window:
      hours: [10, 17]
    conditions:
      uv_index: {gte: 6}
    advice: >-
      Protect a child's skin for this outing. A UV index of 6 or above burns young
      skin in well under an hour, and childhood sunburn carries lifetime risk.
      Use shade as the main defence, add a wide-brimmed hat and a long-sleeved top,
      apply broad-spectrum SPF 30+ twenty minutes before going out and again every
      two hours, and keep infants under six months out of direct sun entirely.
    cite_as: SOP-VG-06 (Sun protection for a child)

  - id: SOP-VG-07
    category: vulnerable_groups
    severity: low
    title: Settled conditions with a child outdoors
    kind: numeric
    applies_to:
      audience_any: [child]
    conditions:
      all_of:
        - apparent_temperature: {lt: 34}
        - apparent_temperature_min: {gt: 8}
    advice: >-
      Nothing in the forecast argues against taking a child out: the feels-like
      temperature is inside the band where neither heat nor cold is the problem.
      Still bring more water than you think you need, keep a sun hat with you, and
      plan a shaded spot to rest - children overheat faster than adults even on an
      ordinary day. Check the UV note below if you are going out between 10:00
      and 17:00.
    cite_as: SOP-VG-07 (Settled conditions with a child outdoors)

  - id: SOP-VG-08
    category: vulnerable_groups
    severity: low
    title: Settled conditions for an older adult outdoors
    kind: numeric
    applies_to:
      audience_any: [elderly]
    conditions:
      all_of:
        - apparent_temperature: {lt: 32}
        - apparent_temperature_min: {gt: 10}
    advice: >-
      Nothing in the forecast argues against an outing for an older adult: the
      feels-like temperature is below the heat threshold and above the cold one.
      Keep it short and unhurried anyway, take water and have them drink on a
      schedule rather than on thirst, choose even ground and a route with somewhere
      to sit, and take a layer in case it turns. Do not assume guidance written for a
      fit younger adult transfers to them.
    cite_as: SOP-VG-08 (Settled conditions for an older adult outdoors)

  - id: SOP-VG-09
    category: vulnerable_groups
    severity: low
    title: Settled conditions for walking a dog
    kind: numeric
    applies_to:
      audience_any: [pet]
      activity_tags_any: [pet_walk]
    conditions:
      all_of:
        - temperature_2m: {lt: 28}
        - temperature_2m: {gt: 2}
    advice: >-
      Reasonable conditions for a dog walk: the air is below the range where paved
      ground starts to burn paw pads and above the range where small or short-coated
      dogs get cold quickly. Still check the pavement with the back of your hand
      before a long stretch of asphalt, carry water for the dog as well as yourself,
      and remember a dog cannot tell you it has had enough - watch for heavy panting
      or lagging behind.
    cite_as: SOP-VG-09 (Settled conditions for walking a dog)

  - id: SOP-VG-10
    category: vulnerable_groups
    severity: moderate
    title: Cold risk for a dog
    kind: numeric
    applies_to:
      audience_any: [pet]
      activity_tags_any: [pet_walk]
    conditions:
      temperature_2m: {lte: 2}
    advice: >-
      Keep a dog walk very short at or below 2 C. Small breeds, short-coated breeds,
      puppies and old dogs lose heat fast and can become hypothermic well before a
      person feels properly cold. Use a coat for a thin-coated dog, avoid grit and
      road salt which burns paws and is toxic if licked off, rinse and dry the paws
      afterwards, and go straight home if the dog lifts its paws, shivers or stops
      wanting to walk.
    cite_as: SOP-VG-10 (Cold risk for a dog)

  - id: SOP-VG-11
    category: vulnerable_groups
    severity: moderate
    title: Warm pavement caution for a dog
    kind: numeric
    applies_to:
      audience_any: [pet]
      activity_tags_any: [pet_walk]
    conditions:
      all_of:
        - temperature_2m: {gte: 28}
        - temperature_2m: {lt: 32}
    advice: >-
      Between 28 C and 32 C, walk the dog but change where and when. Asphalt in sun
      is already well hotter than the air at these temperatures. Keep to grass and
      shade, test the pavement with the back of your hand for seven seconds before
      any long paved stretch, cut the distance, carry water and offer it often, and
      go out early or after sunset instead of the middle of the day. Heavy panting,
      drooling or lagging behind means stop and cool the dog down.
    cite_as: SOP-VG-11 (Warm pavement caution for a dog)
