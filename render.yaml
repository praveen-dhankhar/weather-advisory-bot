# Render Blueprint for the REST API (POST /chat). The chat UI on Streamlit Community
# Cloud runs the graph itself; this is the same graph behind FastAPI, for API clients.
# Render asks for NVIDIA_API_KEY when the Blueprint is created; it never enters the repo.
# Python is pinned by .python-version.
services:
  - type: web
    name: weather-advisory-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One process: session memory and the turn caps live in it.
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass  # redeploy main only after the GitHub Actions suite passes
    envVars:
      - key: LLM_PROVIDER
        value: nvidia
      - key: LLM_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: NVIDIA_API_KEY
        sync: false
      - key: LLM_TIMEOUT
        value: "120"
      - key: MAX_TURNS_PER_SESSION
        value: "30"
      - key: MAX_TURNS_PER_HOUR
        value: "120"
